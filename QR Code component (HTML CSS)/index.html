<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Title</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        :root{
            --slate-900: #1f314f;
            --slate-500: #68778D;
            --slate-300: #D5E1EF;
            --white: #ffffff;

            --spaсing-xl: 40px;
            --spaсing-m: 24px;
            --spaсing-s: 16px;

            --card-shadow: 0px 25px 25px 0px rgba(0, 0, 0, 0.0477);
        }

        body {
            background-color: var(--slate-300);
            display: flex;
            flex-direction: row;
            justify-content: center;
        }

        .content{
            display:flex;
            flex-direction: column;
            gap: 24px;
            box-sizing: border-box;
            position: fixed;
            width: fit-content;
            height: fit-content;
            top: 50%;
            left: 50%;
            padding-top: var(--spaсing-s);
            padding-left: var(--spaсing-s);
            padding-right: var(--spaсing-s);
            padding-bottom: var(--spaсing-xl);
            border-radius: 20px;
            background-color: var(--white);
            box-shadow: var(--card-shadow);
            transform: translate(-50%, -50%);

        }

        .text{
            width:288px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 0 16px;
        }
        .qr-image{
            align-self: center;
            width: 288px;
            aspect-ratio: 1/1;
            border-radius: 10px;
        }
        .text-display{
            width: 100%;
            font-family: Outfit, sans-serif;
            color: var(--slate-900);
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            line-height: 1.2;
            letter-spacing: 0;
        }

        .text-body{
            width: 100%;
            font-family: Outfit, sans-serif;
            color: var(--slate-500);
            text-align: center;
            font-size: 15px;
            font-weight: normal;
            line-height: 1.4;
            letter-spacing: 0.2px;
        }

    </style>
</head>
<body>
    <div class="content">
        <img src="images/image-qr-code.png" alt="QR Code" class="qr-image">
        <div class="text">
            <p class="text-display">Improve your front-end skills by building projects</p>
            <p class="text-body">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
        </div>
    </div>
</body>
</html>
