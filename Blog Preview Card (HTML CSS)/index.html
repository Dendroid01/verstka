<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        :root {
            --yellow: #f4d04e;
            --gray-950: #111111;
            --gray-500: #6b6b6b;
            --white: #ffffff;


            --spacing-300: 24px;
            --spacing-150: 12px;
            --spacing-100: 8px;
            --spacing-50: 4px;
        }

        .text-preset-1 {
            font-family: Figtree, sans-serif;
            font-weight: 800;
            font-size: 24px;
            line-height: 1.5;
            letter-spacing: 0;
        }

        .text-preset-2 {
            font-family: Figtree, sans-serif;
            font-weight: 500;
            font-size: 16px;
            line-height: 1.5;
            letter-spacing: 0;
        }

        .text-preset-3 {
            font-family: Figtree, sans-serif;
            font-weight: 500;
            font-size: 14px;
            line-height: 1.5;
            letter-spacing: 0;
        }

        .text-preset-4 {
            font-family: Figtree, sans-serif;
            font-weight: 800;
            font-size: 14px;
            line-height: 1.5;
            letter-spacing: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--yellow);
        }

        .card {
            width: 384px;
            height: fit-content;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            background-color: var(--white);
            gap: 24px;
            padding: 24px;
            border-radius: 20px;
            transition: box-shadow 0.6s ease;
            box-shadow: 8px 8px 0 0 #000000,
            inset 0 0 0 1px #000000;
        }

        .card:hover {
            box-shadow: 16px 16px 0 0 #000000,
            inset 0 0 0 1px #000000;

            .title {
                color: var(--yellow);
            }
        }

        .image {
            display: flex;
            width: 100%;
            height: 200px;
            overflow: hidden;
            border-radius: 10px;
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .category {
            width: fit-content;
            height: fit-content;
            padding: 4px 12px;
            background-color: var(--yellow);
            border-radius: 4px;
        }

        .publish-date {
            width: fit-content;
            height: fit-content;
        }

        .title {
            width: 100%;
            height: fit-content;
            transition: color 0.6s ease;
        }

        .description {
            width: 100%;
            height: fit-content;
            color: var(--gray-500);
        }

        .author {
            width: fit-content;
            height: fit-content;
            display: flex;
            flex-direction: row;
            gap: 12px;
            align-items: center;
        }

        .avatar-image {
            width: 32px;
            aspect-ratio: 1/1;

        }

        @media (max-width: 376px) {
            .card {
                width: 327px;
            }

            .category.text-preset-4 {
                font-size: 12px;
            }

            .text-preset-3 {
                font-size: 12px;
            }

            .text-preset-1 {
                font-size: 20px;
            }

            .text-preset-2 {
                font-size: 14px;
            }

        }
    </style>
</head>
<body>
<div class="card">
    <div class="image"><img src="assets/images/illustration-article.svg" alt="Illustration"></div>
    <div class="content">
        <p class="category text-preset-4">Learning</p>

        <p class="publish-date text-preset-3">Published 21 Dec 2023</p>
        <p class="title text-preset-1">HTML & CSS foundations</p>
        <p class="description text-preset-2">These languages are the backbone of every website, defining structure,
            content, and presentation.</p>
    </div>

    <div class="author">
        <img class="avatar-image" src="assets/images/image-avatar.webp" alt="Avatar">
        <p class="authorname text-preset-4">Greg Hooper</p>
    </div>


</div>

</body>
</html>
